{% extends 'base.html' %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    body { background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%) !important; min-height: 100vh; }
    .container.bg-secondary-subtle { background: transparent !important; }

    .editar-page { max-width: 820px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

    /* ── Hero ── */
    .editar-hero {
        background: linear-gradient(135deg, rgba(15,12,41,.9) 0%, rgba(48,43,99,.9) 100%);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        padding: 2rem 2.5rem;
        margin-bottom: 2rem;
        display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
        box-shadow: 0 20px 60px rgba(0,0,0,.4);
        border: 1px solid rgba(255,255,255,.12);
        position: relative; overflow: hidden;
    }
    .editar-hero::before {
        content: '';
        position: absolute; top: 0; left: 0; right: 0; height: 3px;
        background: linear-gradient(90deg, #f97316, #ec4899, #6a11cb, #2575fc);
    }
    .editar-hero-left { display: flex; align-items: center; gap: 1.2rem; }
    .editar-hero-icon {
        width: 54px; height: 54px;
        background: rgba(249,115,22,.2);
        border: 1px solid rgba(249,115,22,.4);
        border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.3rem; color: #fb923c; flex-shrink: 0;
    }
    .editar-hero h1 { font-size: 1.5rem; font-weight: 700; color: #fff; margin: 0; }
    .editar-hero p  { color: rgba(255,255,255,.55); margin: 0; font-size: .87rem; }
    .sala-name-badge {
        display: inline-block; margin-top: .3rem;
        font-size: .8rem; font-weight: 700;
        background: rgba(249,115,22,.15); border: 1px solid rgba(249,115,22,.35);
        color: #fb923c; padding: .2rem .7rem; border-radius: 20px;
    }
    .btn-voltar {
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.12);
        color: rgba(255,255,255,.7); border-radius: 12px;
        padding: .55rem 1.2rem; font-size: .85rem; font-weight: 600;
        text-decoration: none; display: inline-flex; align-items: center; gap: .45rem;
        transition: all .25s; white-space: nowrap;
    }
    .btn-voltar:hover { background: rgba(255,255,255,.14); color: #fff; }

    /* ── Cards de seção ── */
    .form-card {
        background: rgba(255,255,255,.05);
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 20px; padding: 2rem 2.5rem;
        backdrop-filter: blur(10px); margin-bottom: 1.5rem;
    }
    .section-label {
        font-size: .7rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
        color: #a78bfa; margin-bottom: 1.2rem;
        display: flex; align-items: center; gap: .5rem;
    }
    .section-label::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.08); }

    /* ── Inputs ── */
    .field-wrap { margin-bottom: 1.5rem; }
    .field-wrap label {
        display: block; font-size: .82rem; font-weight: 600;
        color: rgba(255,255,255,.65); margin-bottom: .5rem; letter-spacing: .3px;
    }
    .field-wrap input {
        width: 100%;
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 12px; padding: .75rem 1rem;
        color: #fff; font-size: .95rem; transition: all .25s; outline: none;
    }
    .field-wrap input::placeholder { color: rgba(255,255,255,.3); }
    .field-wrap input:focus {
        border-color: rgba(249,115,22,.7);
        background: rgba(249,115,22,.08);
        box-shadow: 0 0 0 3px rgba(249,115,22,.15);
    }
    .field-wrap input[type="number"] { -moz-appearance: textfield; }
    .field-wrap input[type="number"]::-webkit-inner-spin-button { opacity: .4; }

    /* ── Personagem cards ── */
    .personagens-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 1rem;
    }
    .personagem-card-wrapper input[type="checkbox"] { display: none; }
    .personagem-card {
        background: rgba(255,255,255,.04);
        border: 1.5px solid rgba(255,255,255,.1);
        border-radius: 16px; padding: 1.3rem 1rem;
        text-align: center; cursor: pointer;
        transition: all .25s ease;
        display: flex; flex-direction: column; align-items: center; gap: .5rem;
        height: 100%; position: relative; overflow: hidden;
    }
    .personagem-card:hover { border-color: rgba(167,139,250,.4); transform: translateY(-3px); background: rgba(255,255,255,.07); }

    .personagem-card.selected-dominante  { border-color: #f97316; background: rgba(249,115,22,.12);  box-shadow: 0 0 20px rgba(249,115,22,.2); }
    .personagem-card.selected-influente  { border-color: #ec4899; background: rgba(236,72,153,.12);  box-shadow: 0 0 20px rgba(236,72,153,.2); }
    .personagem-card.selected-analitico  { border-color: #3b82f6; background: rgba(59,130,246,.12);  box-shadow: 0 0 20px rgba(59,130,246,.2); }
    .personagem-card.selected-estavel    { border-color: #22c55e; background: rgba(34,197,94,.12);   box-shadow: 0 0 20px rgba(34,197,94,.2); }

    .card-check-icon {
        position: absolute; top: .6rem; right: .6rem;
        width: 22px; height: 22px;
        background: rgba(255,255,255,.08); border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: .6rem; color: transparent; transition: all .25s;
    }
    .personagem-card.selected-dominante .card-check-icon,
    .personagem-card.selected-influente .card-check-icon,
    .personagem-card.selected-analitico .card-check-icon,
    .personagem-card.selected-estavel   .card-check-icon { background: rgba(255,255,255,.2); color: #fff; }

    .disc-icon {
        width: 46px; height: 46px; border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.2rem; color: #fff; margin-bottom: .3rem; flex-shrink: 0;
    }
    .disc-icon.dominante { background: linear-gradient(135deg,#f97316,#ea580c); }
    .disc-icon.influente  { background: linear-gradient(135deg,#ec4899,#db2777); }
    .disc-icon.analitico  { background: linear-gradient(135deg,#3b82f6,#1d4ed8); }
    .disc-icon.estavel    { background: linear-gradient(135deg,#22c55e,#15803d); }

    .personagem-card h6 { font-size: .82rem; font-weight: 700; color: #fff; margin: 0; line-height: 1.3; }
    .disc-badge {
        font-size: .68rem; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
        padding: .2rem .6rem; border-radius: 20px; margin-top: .2rem;
    }
    .disc-badge.dominante { background: rgba(249,115,22,.2); color: #fb923c; }
    .disc-badge.influente  { background: rgba(236,72,153,.2); color: #f472b6; }
    .disc-badge.analitico  { background: rgba(59,130,246,.2);  color: #60a5fa; }
    .disc-badge.estavel    { background: rgba(34,197,94,.2);   color: #4ade80; }

    /* ── Botões ── */
    .form-actions { display: flex; gap: .8rem; justify-content: flex-end; flex-wrap: wrap; }
    .btn-cancelar {
        background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
        color: rgba(255,255,255,.7); border-radius: 12px; padding: .7rem 1.5rem;
        font-weight: 600; font-size: .9rem; text-decoration: none;
        display: inline-flex; align-items: center; gap: .5rem; transition: all .25s;
    }
    .btn-cancelar:hover { background: rgba(255,255,255,.14); color: #fff; }
    .btn-salvar {
        background: linear-gradient(135deg, #f97316, #ea580c);
        border: none; color: #fff; border-radius: 12px;
        padding: .7rem 1.8rem; font-weight: 700; font-size: .9rem;
        display: inline-flex; align-items: center; gap: .5rem; transition: all .25s;
        box-shadow: 0 4px 20px rgba(249,115,22,.4); cursor: pointer;
    }
    .btn-salvar:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(249,115,22,.5); color: #fff; }
</style>
{% endblock %}

{% block content %}
<div class="editar-page">

    <!-- Hero -->
    <div class="editar-hero">
        <div class="editar-hero-left">
            <div class="editar-hero-icon"><i class="fas fa-pen"></i></div>
            <div>
                <h1>Editar Sala</h1>
                <span class="sala-name-badge"><i class="fas fa-door-closed" style="font-size:.7rem"></i> {{ sala.nome }}</span>
            </div>
        </div>
        <a href="{% url 'detalhe_sala_admin' sala.id %}" class="btn-voltar">
            <i class="fas fa-arrow-left"></i> Voltar
        </a>
    </div>

    <form method="post" novalidate>
        {% csrf_token %}

        <!-- Informações básicas -->
        <div class="form-card">
            <div class="section-label"><i class="fas fa-info-circle"></i> Informações da Sala</div>

            <div class="field-wrap">
                <label for="{{ form.nome.id_for_label }}">Nome da Sala</label>
                <input type="text" name="nome" id="{{ form.nome.id_for_label }}"
                       placeholder="Ex: Turma de Vendas — Março 2026"
                       value="{{ form.nome.value|default_if_none:'' }}" maxlength="100">
            </div>

            <div class="field-wrap" style="max-width:260px">
                <label for="{{ form.capacidade_maxima.id_for_label }}">Nº Máximo de Participantes</label>
                <input type="number" name="capacidade_maxima" id="{{ form.capacidade_maxima.id_for_label }}"
                       placeholder="20" min="1"
                       value="{{ form.capacidade_maxima.value|default_if_none:20 }}">
            </div>
        </div>

        <!-- Personagens -->
        <div class="form-card">
            <div class="section-label"><i class="fas fa-user-secret"></i> Personagens Disponíveis</div>

            <div class="personagens-grid">
                {% for personagem in personagens %}
                <div class="personagem-card-wrapper">
                    <input type="checkbox"
                           name="personagens_disponiveis"
                           value="{{ personagem.id }}"
                           id="pc-{{ personagem.id }}"
                           {% if personagem in sala.personagens_disponiveis.all %}checked{% endif %}>

                    <label for="pc-{{ personagem.id }}"
                           class="personagem-card {% if personagem in sala.personagens_disponiveis.all %}selected-{{ personagem.perfil_disc }}{% endif %}"
                           data-perfil="{{ personagem.perfil_disc }}">

                        <div class="card-check-icon"><i class="fas fa-check"></i></div>

                        <div class="disc-icon {{ personagem.perfil_disc }}">
                            {% if personagem.perfil_disc == 'dominante' %}<i class="fas fa-bolt"></i>
                            {% elif personagem.perfil_disc == 'influente' %}<i class="fas fa-comments"></i>
                            {% elif personagem.perfil_disc == 'analitico' %}<i class="fas fa-microscope"></i>
                            {% elif personagem.perfil_disc == 'estavel' %}<i class="fas fa-shield-alt"></i>
                            {% endif %}
                        </div>

                        <h6>{{ personagem.short_name }}</h6>
                        <span class="disc-badge {{ personagem.perfil_disc }}">{{ personagem.get_perfil_disc_display }}</span>
                    </label>
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- Ações -->
        <div class="form-actions">
            <a href="{% url 'detalhe_sala_admin' sala.id %}" class="btn-cancelar">
                <i class="fas fa-times"></i> Cancelar
            </a>
            <button type="submit" class="btn-salvar">
                <i class="fas fa-save"></i> Salvar Alterações
            </button>
        </div>
    </form>
</div>

<script>
document.querySelectorAll('.personagem-card-wrapper input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', function () {
        const card = this.nextElementSibling;
        const perfil = card.dataset.perfil;
        ['dominante','influente','analitico','estavel'].forEach(p => card.classList.remove('selected-' + p));
        if (this.checked) card.classList.add('selected-' + perfil);
    });
});
</script>
{% endblock %}
